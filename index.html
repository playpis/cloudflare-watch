<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC + XAUT Watch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;}
.container{display:flex;width:200vw;height:100vh;overflow-x:auto;scroll-snap-type:x mandatory;}
.page{width:100vw;height:100vh;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;align-items:center;scroll-snap-align:start;}
.symbol{color:#888;font-size:20px;margin-bottom:8px;}
.price{font-size:38px;font-weight:700;}
.change{margin-top:8px;font-size:16px;}
.range{margin-top:8px;font-size:12px;color:#888;}
.signal{margin-top:12px;font-size:14px;}
.green{color:#00ff88;}
.red{color:#ff4d4f;}
</style>
</head>
<body>

<div class="container">

  <!-- BTC 页面 -->
  <div class="page">
    <div class="symbol">BTC</div>
    <div class="price" id="btc-price">$--</div>
    <div class="change" id="btc-change">--</div>
    <div class="range" id="btc-range">--</div>
    <div class="signal" id="btc-signal">--</div>
  </div>

  <!-- XAUT 页面 -->
  <div class="page">
    <div class="symbol">XAUT</div>
    <div class="price" id="xaut-price">$--</div>
    <div class="change" id="xaut-change">--</div>
    <div class="range" id="xaut-range">--</div>
    <div class="signal" id="xaut-signal">--</div>
  </div>

</div>

<script>
function getSignal(asset, change){
  if(asset==="btc"){
    if(change>1) return "🚀 Bullish";
    if(change<-1) return "⚠️ Weak";
    return "😐 Sideways";
  } else if(asset==="xaut"){
    if(change>1) return "🛡️ Demand Rising";
    if(change<-1) return "📉 Demand Falling";
    return "😐 Stable";
  }
}

function colorize(el,value){
  el.className = value>=0 ? "change green" : "change red";
}

// 从 OKX API 拉数据
async function loadData(){
  try{
    // BTC
    const btcRes = await fetch("https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT");
    const btcData = await btcRes.json();
    const btcPrice = parseFloat(btcData.data[0].last);
    const btcHigh = parseFloat(btcData.data[0].high24h);
    const btcLow = parseFloat(btcData.data[0].low24h);
    const btcChange = ((btcPrice - parseFloat(btcData.data[0].open24h))/parseFloat(btcData.data[0].open24h))*100;

    document.getElementById("btc-price").innerText="$"+btcPrice.toLocaleString();
    const btcEl = document.getElementById("btc-change");
    btcEl.innerText=(btcChange>=0?"+":"")+btcChange.toFixed(2)+"%";
    colorize(btcEl, btcChange);
    document.getElementById("btc-range").innerText=`H ${btcHigh} · L ${btcLow}`;
    document.getElementById("btc-signal").innerText=getSignal("btc",btcChange);

    // XAUT
    const xautRes = await fetch("https://www.okx.com/api/v5/market/ticker?instId=XAUT-USD");
    const xautData = await xautRes.json();
    const xautPrice = parseFloat(xautData.data[0].last);
    const xautHigh = parseFloat(xautData.data[0].high24h);
    const xautLow = parseFloat(xautData.data[0].low24h);
    const xautChange = ((xautPrice - parseFloat(xautData.data[0].open24h))/parseFloat(xautData.data[0].open24h))*100;

    document.getElementById("xaut-price").innerText="$"+xautPrice.toFixed(2);
    const xEl = document.getElementById("xaut-change");
    xEl.innerText=(xautChange>=0?"+":"")+xautChange.toFixed(2)+"%";
    colorize(xEl, xautChange);
    document.getElementById("xaut-range").innerText=`H ${xautHigh} · L ${xautLow}`;
    document.getElementById("xaut-signal").innerText=getSignal("xaut",xautChange);

  }catch(e){
    console.log(e);
    document.getElementById("btc-price").innerText="ERROR";
    document.getElementById("xaut-price").innerText="ERROR";
  }
}

loadData();
setInterval(loadData, 300000); // 5分钟刷新
</script>

</body>
</html>
