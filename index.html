<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f5f6f8;--card:#ffffff;--border:#e2e5ea;--text:#1a1a2e;--dim:#8a94a6;--green:#10b981;--red:#ef4444;--accent:#3b82f6;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;}
.container{max-width:1080px;margin:0 auto;padding:16px;}

/* 标题 */
h1{font-size:18px;font-weight:700;margin:8px 4px 16px;}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}

/* 价格卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card .symbol{font-size:13px;color:var(--dim);letter-spacing:.5px;}
.card .price{font-size:28px;font-weight:700;margin:6px 0;}
.card .change{font-size:13px;font-weight:500;}
.card .range{font-size:12px;color:var(--dim);margin-top:6px;}
.card .signal{font-size:12px;margin-top:8px;padding:2px 8px;border-radius:4px;display:inline-block;background:#f0f2f5;color:#4a5568;}
.sparkline{width:100%;height:40px;margin-top:12px;display:block;}
.green{color:var(--green);}
.red{color:var(--red);}

/* 新闻卡片 */
.news-card{grid-column:1/-1;}
.news-card h3{font-size:13px;color:var(--dim);margin-bottom:10px;letter-spacing:.5px;}
.news-item{padding:9px 0;border-bottom:1px solid #eef0f4;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.news-item:last-child{border-bottom:none;}
.news-item a{color:var(--text);text-decoration:none;font-size:13px;line-height:1.5;flex:1;}
.news-item a:hover{color:var(--accent);}
.news-item .time{font-size:11px;color:var(--dim);white-space:nowrap;padding-top:2px;}

.loading{text-align:center;padding:30px;color:var(--dim);font-size:13px;grid-column:1/-1;}
.error{color:var(--red);}
</style>
</head>
<body>
<div class="container">
  <h1>Crypto</h1>
  <div class="grid" id="grid">
    <div class="loading">加载中...</div>
  </div>
</div>

<script>
// ========== 价格 ==========
const ASSETS=[
  {id:'bitcoin',name:'BTC'},
  {id:'ethereum',name:'ETH'},
  {id:'binancecoin',name:'BNB'},
  {id:'solana',name:'SOL'},
  {id:'monero',name:'XMR'},
  {id:'tether-gold',name:'XAUT'},
];

function getSignal(name,ch){
  if(name==='BNB'||name==='SOL'){
    if(ch>3)return'🚀 强势';if(ch<-3)return'⚠️ 弱势';return'😐 震荡';
  }
  if(name==='BTC'||name==='ETH'){
    if(ch>3)return'🚀 强势';if(ch<-3)return'⚠️ 弱势';return'😐 震荡';
  }
  if(name==='XMR'){
    if(ch>2)return'🟢 上涨';if(ch<-2)return'🔴 下跌';return'⚪ 横盘';
  }
  if(name==='XAUT'){
    if(ch>1)return'🛡️ 需求升';if(ch<-1)return'📉 需求降';return'😐 稳定';
  }
  return'';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 生成 SVG sparkline (7天走势)
function sparkline(prices){
  if(!prices||prices.length<2)return'';
  const w=280,h=40,pad=2;
  const min=Math.min(...prices),max=Math.max(...prices);
  const range=(max-min)||1;
  const step=w/(prices.length-1);
  const pts=prices.map((p,i)=>{
    const x=pad+i*step;
    const y=h-pad-((p-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const up=prices[prices.length-1]>=prices[0];
  const color=up?'#10b981':'#ef4444';
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

async function loadPrices(){
  const grid=document.getElementById('grid');
  try{
    const res=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,binancecoin,solana,monero,tether-gold&order=market_cap_desc&sparkline=true');
    const data=await res.json();
    const cards=data.map(c=>{
      const ch=c.price_change_percentage_24h||0;
      const cls=ch>=0?'green':'red';
      const sign=ch>=0?'+':'';
      const sig=getSignal(c.symbol,Math.abs(ch));
      return `<div class="card">
        <div class="symbol">${esc(c.symbol.toUpperCase())} · ${esc(c.name)}</div>
        <div class="price">$${Number(c.current_price).toLocaleString()}</div>
        <div class="change ${cls}">${sign}${ch.toFixed(2)}% (24h)</div>
        <div class="range">H $${Number(c.high_24h||0).toLocaleString()} · L $${Number(c.low_24h||0).toLocaleString()}</div>
        <div class="signal">${sig}</div>
        ${sparkline(c.sparkline_in_7d?.price)}
      </div>`;
    }).join('');
    const news=`<div class="card news-card" id="news"><h3>加密新闻</h3><div class="loading">加载中...</div></div>`;
    grid.innerHTML=cards+news;
    loadNews();
  }catch(e){
    grid.innerHTML='<div class="loading error">价格加载失败: '+esc(e.message)+'</div>';
  }
}
loadPrices();
setInterval(loadPrices,120000);

// ========== 新闻 ==========
async function loadNews(){
  const news=document.getElementById('news');
  if(!news)return;
  try{
    const res=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.coindesk.com/arc/outboundfeeds/rss/');
    const data=await res.json();
    if(data.status!=='ok'||!data.items)throw new Error('RSS error');
    const items=data.items.slice(0,10);
    news.innerHTML='<h3>Crypto News</h3>'+
      items.map(it=>`
        <div class="news-item">
          <a href="${esc(it.link)}" target="_blank">${esc(it.title)}</a>
          <span class="time">${it.pubDate?new Date(it.pubDate).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span>
        </div>`).join('');
  }catch(e){
    // Fallback: CoinTelegraph
    try{
      const res2=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://cointelegraph.com/rss');
      const data2=await res2.json();
      const items=data2.items.slice(0,10);
        news.innerHTML='<h3>Crypto News (CoinTelegraph)</h3>'+
        items.map(it=>`
          <div class="news-item">
            <a href="${esc(it.link)}" target="_blank">${esc(it.title)}</a>
            <span class="time">${it.pubDate?new Date(it.pubDate).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span>
          </div>`).join('');
    }catch(e2){
        news.innerHTML='<h3>Crypto News</h3><div class="loading error">加载失败</div>';
    }
  }
}
</script>
</body>
</html>
