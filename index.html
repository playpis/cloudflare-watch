<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f5f6f8;--card:#ffffff;--border:#e2e5ea;--text:#1a1a2e;--dim:#8a94a6;--green:#10b981;--red:#ef4444;--accent:#3b82f6;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;}
.container{max-width:1080px;margin:0 auto;padding:16px;}

/* 标题 */
h1{font-size:18px;font-weight:700;margin:8px 4px 16px;}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}

.card .signal{font-size:12px;margin-top:8px;padding:2px 8px;border-radius:4px;display:inline-block;background:#f0f2f5;color:#4a5568;}
.sparkline{width:100%;height:40px;margin-top:12px;display:block;}
.rsi{font-size:12px;margin-top:8px;padding:2px 8px;border-radius:4px;display:inline-block;background:#f0f2f5;color:#4a5568;}
.rsi.rsi-high{background:#fde8e8;color:#c0392b;}
.rsi.rsi-low{background:#e6f9ef;color:#1e8449;}

.red{color:var(--red);}

<body>
<div class="container">
  <h1>Crypto</h1>
  <div class="grid" id="grid">
    <div class="loading">加载中...</div>
  </div>
</div>

<script>
// ========== 监控资产 ==========
const ASSETS=[
  {id:'bitcoin',name:'BTC'},
  {id:'ethereum',name:'ETH'},
  {id:'binancecoin',name:'BNB'},
  {id:'solana',name:'SOL'},
  {id:'monero',name:'XMR'},
  {id:'tether-gold',name:'XAUT'},
];

function getSignal(name,ch){
  if(name==='BNB'||name==='SOL'){
    if(ch>3)return'🚀 强势';
    if(ch<-3)return'⚠️ 弱势';
    return'😐 震荡';
  }
  if(name==='BTC'||name==='ETH'){
    if(ch>3)return'🚀 强势';
    if(ch<-3)return'⚠️ 弱势';
    return'😐 震荡';
  }
  if(name==='XMR'){
    if(ch>2)return'🟢 上涨';
    if(ch<-2)return'🔴 下跌';
    return'⚪ 横盘';
  }
  if(name==='XAUT'){
    if(ch>1)return'🛡️ 需求升';
    if(ch<-1)return'📉 需求降';
    return'😐 稳定';
  }
  return'';
}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ========== 7天走势图 ==========
function sparkline(prices){
  if(!prices||prices.length<2)return'';

  const w=280,h=40,pad=2;
  const min=Math.min(...prices);
  const max=Math.max(...prices);
  const range=(max-min)||1;
  const step=w/(prices.length-1);

  const pts=prices.map((p,i)=>{
    const x=pad+i*step;
    const y=h-pad-((p-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const up=prices[prices.length-1]>=prices[0];
  const color=up?'#10b981':'#ef4444';

  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// ========== RSI-14 ==========
function rsi14(closes,period=14){
  if(!closes||closes.length<period+1)return null;

  let gain=0,loss=0;

  for(let i=1;i<=period;i++){
    const d=closes[i]-closes[i-1];
    if(d>=0)gain+=d;
    else loss-=d;
  }

  let avgG=gain/period;
  let avgL=loss/period;

  for(let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    avgG=(avgG*(period-1)+Math.max(d,0))/period;
    avgL=(avgL*(period-1)+Math.max(-d,0))/period;
  }

  if(avgL===0)return avgG===0?50:100;

  const rs=avgG/avgL;
  return 100-100/(1+rs);
}

// ========== 加载 XMR RSI（日线） ==========
async function loadXmrRsi(){
  const el=document.getElementById('xmr-rsi');
  if(!el)return;

  try{
    const res=await fetch(
      'https://api.kraken.com/0/public/OHLC?pair=XMRUSD&interval=1440'
    );

    if(!res.ok)throw new Error('HTTP '+res.status);

    const d=await res.json();
    const rows=Object.values(d.result||{})[0];

    if(!rows||rows.length<16)throw new Error('no data');

    const closes=rows.map(r=>+r[4]);
    const rsi=rsi14(closes);

    if(rsi===null)throw new Error('calc fail');

    const val=rsi.toFixed(1);
    let label='Neutral';
    let cls='';

    if(rsi>=70){
      label='Overbought';
      cls='rsi-high';
    }else if(rsi<=30){
      label='Oversold';
      cls='rsi-low';
    }

    el.textContent=`RSI-14 ${val} · ${label}`;
    el.className='rsi'+(cls?' '+cls:'');

  }catch(e){
    el.textContent='RSI --';
    el.className='rsi';
  }
}

// ========== 加载加密货币价格 ==========
async function loadPrices(){
  const grid=document.getElementById('grid');

  try{
    const res=await fetch(
      'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,binancecoin,solana,monero,tether-gold&order=market_cap_desc&sparkline=true'
    );

    if(!res.ok)throw new Error('HTTP '+res.status);

    const data=await res.json();

    if(!Array.isArray(data)||data.length===0){
      throw new Error('没有返回价格数据');
    }

    const cards=data.map(c=>{
      const ch=c.price_change_percentage_24h||0;
      const cls=ch>=0?'green':'red';
      const sign=ch>=0?'+':'';
      const sig=getSignal(c.symbol.toUpperCase(),ch);

      return `<div class="card">
        <div class="symbol">${esc(c.symbol.toUpperCase())} · ${esc(c.name)}</div>
        <div class="price">$${Number(c.current_price).toLocaleString('en-US',{maximumFractionDigits:8})}</div>
        <div class="change ${cls}">${sign}${ch.toFixed(2)}% (24h)</div>
        <div class="range">H $${Number(c.high_24h||0).toLocaleString('en-US')} · L $${Number(c.low_24h||0).toLocaleString('en-US')}</div>
        <div class="signal">${sig}</div>
        ${c.symbol.toUpperCase()==='XMR'?'<div class="rsi" id="xmr-rsi">RSI --</div>':''}
        ${sparkline(c.sparkline_in_7d?.price)}
      </div>`;
    }).join('');

    // 只显示价格卡片，不再加载任何新闻
    grid.innerHTML=cards;

    loadXmrRsi();

  }catch(e){
    grid.innerHTML='<div class="loading error">价格加载失败: '+esc(e.message)+'</div>';
  }
}

// ========== 初始化与自动刷新 ==========
loadPrices();
setInterval(loadPrices,120000);
</script>
</body>
